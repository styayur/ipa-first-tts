# SPDX-License-Identifier: MIT
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Model-independent core tests
        run: cargo test -p ipa-core -p tts-core -p alignment-core -p g2p-espeak -p tts-kokoro --no-default-features --locked
      - name: Fallback application lint
        run: cargo clippy -p ipa-desktop --no-default-features --all-targets --locked -- -D warnings
  windows-native:
    name: Windows native build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Kokoro application
        run: cargo build --release --workspace --locked
      - name: Unit tests
        run: cargo test --workspace --locked
