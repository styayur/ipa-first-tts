[package]
name = "ipa-palette"
default-run = "ipa-symbol-palette"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
[dependencies]
symbol-catalog.workspace = true
language-mapping.workspace = true
serde.workspace = true
serde_json.workspace = true
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_Storage_FileSystem", "Win32_Security"] }
[[bin]]
name = "ipa-symbol-palette"
path = "src/main.rs"
[[bin]]
name = "ipa-map"
path = "src/map_main.rs"
