[workspace]
resolver = "2"
exclude = ["third_party/sherpa-onnx-sys"]
members = ["crates/ipa-core", "crates/g2p-espeak", "crates/tts-core", "crates/tts-kokoro", "crates/alignment-core", "crates/symbol-catalog", "crates/language-mapping", "apps/desktop", "apps/palette"]

[workspace.package]
version = "0.3.0-alpha.1"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/styayur/ipa-first-tts"

[workspace.dependencies]
ipa-core = { path = "crates/ipa-core" }
tts-core = { path = "crates/tts-core" }
g2p-espeak = { path = "crates/g2p-espeak" }
tts-kokoro = { path = "crates/tts-kokoro", default-features = false }
alignment-core = { path = "crates/alignment-core" }
symbol-catalog = { path = "crates/symbol-catalog" }
language-mapping = { path = "crates/language-mapping" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"] }
tiny_http = "0.12"

# Preserve the pinned native ABI; fix vulnerable upstream ZIP build tooling.
[patch.crates-io]
sherpa-onnx-sys = { path = "third_party/sherpa-onnx-sys" }
